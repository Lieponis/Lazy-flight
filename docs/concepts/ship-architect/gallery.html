<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Lazy Flight — Ship Gallery</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#dfe4e9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #canvas-wrap { position:absolute; inset:0; }
  canvas { display:block; touch-action:none; }
  #top { position:absolute; top:0; left:0; right:0; padding:10px 12px 8px; background:linear-gradient(#dfe4e9 70%, rgba(223,228,233,0)); }
  #title { color:#2c3540; font-size:16px; font-weight:700; }
  #title small { display:block; font-weight:500; font-size:12px; color:#56616d; margin-top:2px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar { display:none; }
  .cat { flex:none; align-self:center; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7a8590; padding:0 2px 0 4px; }
  .tab { flex:none; border:1px solid #c3cad1; background:rgba(255,255,255,0.85); color:#2c3540; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tab small { font-weight:500; color:#6b7580; margin-left:4px; }
  .tab.active { background:#2c3540; border-color:#2c3540; color:#fff; }
  .tab.active small { color:#c9d1d8; }
  #panel { position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,0.94); border-top:1px solid #c3cad1; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); max-height:40vh; overflow-y:auto; box-shadow: 0 -4px 14px rgba(0,0,0,0.08); }
  #panel h2 { margin:0 0 8px; font-size:13px; color:#44505a; font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
  .part-row { display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:8px; }
  .part-row + .part-row { border-top:1px solid #edf0f2; }
  .part-name { flex:1; font-size:14px; color:#2c3540; }
  .btn { border:none; border-radius:7px; padding:7px 10px; font-size:12px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color: transparent; }
  .btn-toggle { background:#e4e8eb; color:#2c3540; min-width:58px; }
  .btn-toggle.off { background:#f6d9d9; color:#8a3a3a; }
  .btn-highlight { background:#ffcf6b; color:#5a4100; min-width:66px; }
  .btn-highlight.active { background:#ff9e2c; color:#402700; }
  #hint { position:absolute; bottom:calc(40vh + 8px); left:0; right:0; text-align:center; font-size:11px; color:#5c6670; pointer-events:none; }
  #reset { position:absolute; right:12px; bottom:calc(40vh + 30px); background:rgba(255,255,255,0.9); border:1px solid #c3cad1; border-radius:8px; padding:6px 10px; font-size:12px; color:#2c3540; font-weight:600; }
</style>

<body>
<div id="canvas-wrap"></div>
<div id="top">
  <div id="title">Ship Gallery<small>Grey shapes only, approved concepts</small></div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="hint">Drag to rotate &middot; pinch to zoom</div>
<button id="reset">Reset view</button>
<div id="panel">
  <h2>Parts</h2>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- scene ----------
const wrap = document.getElementById("canvas-wrap");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe4e9);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
wrap.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f94, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(3, 4, 2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-3, 1, -2);
scene.add(fill);

// ---------- one grey, flat-shaded material for every part ----------
const GREY = 0x9aa1a8, HILITE = 0xff9e2c;
const baseMat = new THREE.MeshStandardMaterial({ color: GREY, flatShading: true, roughness: 0.75, metalness: 0.05, side: THREE.DoubleSide });
const partMaterial = () => baseMat.clone();

// ---------- every approved ship (code copied from its own viewer) ----------
const SHIPS = [
  {
    slug: "passenger-1", name: "Eggspress", cat: "Passenger", size: "small",
    home: [3.4, 1.8, 3.7], target: [0.0, 0.0, 0.1], minD: 1.6, maxD: 10.0,
    build(THREE, ship, partMaterial, addPart, addGroupPart) {

// ============================================================
// HULL: egg-shaped body, nose at -Z (narrower, rounder point),
// tail at +Z (fuller, rounder end where the engines sit)
// ============================================================
const profilePts = [
  new THREE.Vector2(0.0, -1.15),   // nose tip
  new THREE.Vector2(0.18, -1.08),
  new THREE.Vector2(0.34, -0.98),
  new THREE.Vector2(0.52, -0.82),
  new THREE.Vector2(0.67, -0.60),
  new THREE.Vector2(0.78, -0.34),
  new THREE.Vector2(0.85, -0.04),
  new THREE.Vector2(0.88, 0.22),
  new THREE.Vector2(0.885, 0.42),
  new THREE.Vector2(0.86, 0.62),
  new THREE.Vector2(0.77, 0.84),
  new THREE.Vector2(0.58, 1.02),
  new THREE.Vector2(0.30, 1.15),
  new THREE.Vector2(0.0, 1.22),    // tail cap
];
const HULL_SCALE = new THREE.Vector3(0.95, 0.92, 0.72);
const hullGeo = new THREE.LatheGeometry(profilePts, 22);
hullGeo.rotateX(Math.PI / 2); // long axis -> Z (nose -Z, tail +Z)
hullGeo.computeVertexNormals();
const hullMesh = new THREE.Mesh(hullGeo, partMaterial());
hullMesh.scale.copy(HULL_SCALE);
addPart("hull", "Hull (egg body)", hullMesh);

// radius of the hull's surface of revolution at a given *object-space* z,
// used to seat other parts flush against the hull instead of guessing.
function hullRadiusAtZ(z) {
  const y = z / HULL_SCALE.z;
  for (let i = 0; i < profilePts.length - 1; i++) {
    const a = profilePts[i], b = profilePts[i + 1];
    if (y >= a.y && y <= b.y) {
      const t = (y - a.y) / (b.y - a.y);
      const r = a.x + t * (b.x - a.x);
      return r * (HULL_SCALE.x + HULL_SCALE.y) * 0.5;
    }
  }
  return 0;
}

// ============================================================
// COCKPIT WINDOW: one big round visor bulging from the nose,
// plus a thin raised frame ring right where it meets the hull.
// ============================================================
const winCenterZ = -0.52;
const winRadius = 0.5;
const winZScale = 0.82;
const windowGeo = new THREE.SphereGeometry(winRadius, 18, 14);
windowGeo.scale(1, 1, winZScale);
const windowMesh = new THREE.Mesh(windowGeo, partMaterial());
windowMesh.position.set(0, 0.03, winCenterZ);

const frameGeo = new THREE.TorusGeometry(winRadius * 0.98, 0.028, 8, 22);
const frameMesh = new THREE.Mesh(frameGeo, partMaterial());
frameMesh.position.set(0, 0.03, winCenterZ);

addGroupPart("cockpitWindow", "Cockpit window (visor)", (() => {
  const g = new THREE.Group();
  g.add(windowMesh, frameMesh);
  return g;
})(), [windowMesh, frameMesh]);

// ============================================================
// WING geometry builder — shared shape, used for the two big
// angled side wings and the smaller straight top fin.
// Local axes before any rotation: X = span (root->tip),
// Y = thickness, Z = chord (negative = leading edge).
// ============================================================
function buildWingGeometry(spec, signX) {
  const { rootX, rootTopY, rootBotY, rootFrontZ, rootBackZ,
          tipX, tipTopY, tipBotY, tipFrontZ, tipBackZ } = spec;
  const raw = [
    [rootX, rootTopY, rootFrontZ], // 0 root leading-top
    [rootX, -rootBotY, rootFrontZ], // 1 root leading-bottom
    [rootX, 0, rootBackZ],          // 2 root trailing
    [tipX, tipTopY, tipFrontZ],     // 3 tip leading-top
    [tipX, -tipBotY, tipFrontZ],    // 4 tip leading-bottom
    [tipX, 0, tipBackZ],            // 5 tip trailing
  ];
  const verts = raw.map(([x, y, z]) => [x * signX, y, z]);
  let tris = [
    [0, 3, 5], [0, 5, 2], // top surface
    [1, 2, 5], [1, 5, 4], // bottom surface
    [0, 1, 4], [0, 4, 3], // leading edge
    [3, 4, 5],            // tip cap
  ];
  if (signX < 0) tris = tris.map((t) => [t[0], t[2], t[1]]); // keep outward winding when mirrored

  const positions = new Float32Array(verts.length * 3);
  verts.forEach(([x, y, z], i) => { positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z; });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setIndex(tris.flat());
  geo.computeVertexNormals();
  return geo;
}

// ---- big side wings: ~4x the earlier size, set at 45° with tips angled
// DOWN and outward (an "A" shape seen from the front), per Andy's pick.
const BIG_WING_SPEC = {
  rootX: 0.033, rootTopY: 0.033, rootBotY: 0.027, rootFrontZ: -0.147, rootBackZ: 0.347,
  tipX: 0.80, tipTopY: 0.02, tipBotY: 0.017, tipFrontZ: -0.013, tipBackZ: 0.28,
};
function makeWing(signX) {
  const geo = buildWingGeometry(BIG_WING_SPEC, signX);
  const mesh = new THREE.Mesh(geo, partMaterial(true)); // double-sided: safe against any stray winding
  const wingZ = 0.15;
  const rHull = hullRadiusAtZ(wingZ);
  mesh.position.set(signX * rHull * 0.9, 0.0, wingZ);
  mesh.rotation.z = -signX * ((25 * Math.PI) / 180); // 25° from horizontal, tip rotates downward on both sides
  return mesh;
}
addPart("wingL", "Wing (left)", makeWing(1));
addPart("wingR", "Wing (right)", makeWing(-1));

// ---- top fin: same size as the side wings now, single, straight up on
// the centreline — no angle.
const TOP_FIN_SPEC = {
  rootX: 0.033, rootTopY: 0.033, rootBotY: 0.027, rootFrontZ: -0.147, rootBackZ: 0.347,
  tipX: 0.80, tipTopY: 0.02, tipBotY: 0.017, tipFrontZ: -0.013, tipBackZ: 0.28,
};
function makeTopFin() {
  const geo = buildWingGeometry(TOP_FIN_SPEC, 1);
  const mesh = new THREE.Mesh(geo, partMaterial(true));
  const finZ = 0.28;
  const rHull = hullRadiusAtZ(finZ);
  mesh.position.set(0, rHull * 0.9, finZ);
  mesh.rotation.z = Math.PI / 2; // turns the span from sideways to straight up — no extra tilt
  return mesh;
}
addPart("topFin", "Top fin (centreline)", makeTopFin());

// ============================================================
// ENGINES: bigger, more sci-fi thruster pods at the tail — a
// lathed nozzle body (narrow at the hull, bulging combustion
// chamber, necked throat, wide flared bell), two greeble ribs,
// four radial vanes around the flare, and a raised exhaust rim.
// ============================================================
function makeEngine(signX) {
  const group = new THREE.Group();
  const meshes = [];

  // nozzle body: narrow hull end (-z) -> bulge -> neck -> throat -> wide flared bell (+z)
  const nozzleProfile = [
    new THREE.Vector2(0.10, -0.33), // hull attach
    new THREE.Vector2(0.17, -0.20), // combustion bulge
    new THREE.Vector2(0.15, -0.07), // neck
    new THREE.Vector2(0.19, 0.10),  // throat
    new THREE.Vector2(0.30, 0.23),  // bell starts flaring
    new THREE.Vector2(0.34, 0.33),  // exhaust rim
  ];
  const bodyGeo = new THREE.LatheGeometry(nozzleProfile, 16);
  bodyGeo.rotateX(Math.PI / 2); // wide/flared end faces +Z (exhaust), narrow end faces the hull
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, partMaterial());
  meshes.push(body);

  // a lathe shape is hollow at both ends (it only closes where the profile
  // touches the axis, which ours never does) — that left the exhaust end
  // open, so looking at it from behind showed straight through to nothing.
  // Cap both ends so the nozzle reads as solid from every angle.
  const exhaustCap = new THREE.Mesh(new THREE.CircleGeometry(0.34, 16), partMaterial());
  exhaustCap.position.z = 0.33;
  const hullCap = new THREE.Mesh(new THREE.CircleGeometry(0.10, 12), partMaterial());
  hullCap.position.z = -0.33;
  hullCap.rotation.y = Math.PI; // face the opposite way, into the hull
  meshes.push(exhaustCap, hullCap);

  // greeble ribs at the neck and throat
  const ribNeck = new THREE.Mesh(new THREE.TorusGeometry(0.155, 0.014, 6, 18), partMaterial());
  ribNeck.position.z = -0.07;
  const ribThroat = new THREE.Mesh(new THREE.TorusGeometry(0.195, 0.016, 6, 18), partMaterial());
  ribThroat.position.z = 0.10;
  meshes.push(ribNeck, ribThroat);

  // four small radial vanes around the flare, evenly spaced
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2;
    const vaneGeo = new THREE.BoxGeometry(0.03, 0.09, 0.14);
    const vane = new THREE.Mesh(vaneGeo, partMaterial());
    const vr = 0.27; // sits against the bell, just inboard of its outer radius
    vane.position.set(Math.cos(angle) * vr, Math.sin(angle) * vr, 0.22);
    vane.rotation.z = angle;
    meshes.push(vane);
  }

  // raised rim right at the exhaust face
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.335, 0.02, 7, 20), partMaterial());
  rim.position.z = 0.335;
  meshes.push(rim);

  meshes.forEach((m) => group.add(m));

  const engineZ = 0.78;
  const rHull = hullRadiusAtZ(engineZ - 0.2);
  group.position.set(signX * rHull * 0.62, -0.08, engineZ);
  return { group, meshes };
}
const engL = makeEngine(-1);
const engR = makeEngine(1);
addGroupPart("engineL", "Engine (left)", engL.group, engL.meshes);
addGroupPart("engineR", "Engine (right)", engR.group, engR.meshes);

// ============================================================
// LEGS: three — one nose leg at the front, two main legs at the
// back (left/right), like a small plane's tricycle gear.
//  - struts start INSIDE the hull (not just touching the surface)
//    so there is no empty gap at the join.
//  - all three foot pads sit at the exact same height (one plane).
// ============================================================
const COMMON_FOOT_Y = -0.95;

function strutBetween(p0, p1, radius) {
  const dir = new THREE.Vector3().subVectors(p1, p0);
  const length = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, length, 10);
  const mesh = new THREE.Mesh(geo, partMaterial());
  mesh.position.copy(p0).add(p1).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

function makeLeg(signX, z, footZ) {
  const meshes = [];
  // p0: starts well INSIDE the solid hull (not at the surface), so the
  // strut clearly continues into the body with no visible gap.
  const p0 = new THREE.Vector3(signX * 0.18, -0.26, z);
  // p1 (knee): just past the hull surface, where the leg bends outward.
  const p1 = new THREE.Vector3(signX * (0.18 + 0.34), p0.y - 0.42, z + (signX === 0 ? 0 : 0.0));
  // foot: same Y for every leg, so all three pads are coplanar.
  const foot = new THREE.Vector3(signX * (0.18 + 0.34), COMMON_FOOT_Y, footZ);

  const upper = strutBetween(p0, p1, 0.056); // 2x thicker
  const actuator = strutBetween(
    p0.clone().add(new THREE.Vector3(0, 0, 0.1)), // moved out a bit so the now-thicker struts don't clip each other
    p1.clone().add(new THREE.Vector3(0, 0, 0.1)),
    0.028 // 2x thicker
  );
  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.084, 10, 8), partMaterial()); // scaled up to match the thicker struts
  knee.position.copy(p1);
  const lower = strutBetween(p1, foot, 0.042); // 2x thicker

  const padRadius = 0.18; // 2x the earlier pad size
  const padHeight = 0.064; // 2x the earlier pad size
  const footGeo = new THREE.CylinderGeometry(padRadius, padRadius, padHeight, 12); // flat faces default to facing up/down — always level
  const footMesh = new THREE.Mesh(footGeo, partMaterial());
  footMesh.position.copy(foot).add(new THREE.Vector3(0, -padHeight / 2, 0));

  const ringGeo = new THREE.TorusGeometry(padRadius * 0.58, 0.018, 6, 16);
  ringGeo.rotateX(Math.PI / 2); // flat on top of the pad regardless of strut angle
  const ring = new THREE.Mesh(ringGeo, partMaterial());
  ring.position.copy(footMesh.position).add(new THREE.Vector3(0, padHeight / 2 + 0.002, 0));

  meshes.push(upper, actuator, knee, lower, footMesh, ring);
  const group = new THREE.Group();
  group.add(upper, actuator, knee, lower, footMesh, ring);
  return { group, meshes };
}

const legsGroup = new THREE.Group();
const legMeshes = [];
// nose leg: centreline (signX = 0), well forward; main gear: left/right, aft.
const legSpecs = [
  [0, -0.58, -0.5],   // nose leg
  [1, 0.42, 0.42],    // right main gear
  [-1, 0.42, 0.42],   // left main gear
];
legSpecs.forEach(([signX, z, footZ]) => {
  const { group, meshes } = makeLeg(signX, z, footZ);
  legsGroup.add(group);
  legMeshes.push(...meshes);
});
addGroupPart("legs", "Legs (landing gear)", legsGroup, legMeshes);

ship.position.y = 0.05;

    },
  },
  {
    slug: "passenger-2", name: "Droopliner", cat: "Passenger", size: "medium",
    home: [4.3, 2.1, 4.6], target: [0.0, 0.0, 0.15], minD: 1.8, maxD: 12.0,
    build(THREE, ship, partMaterial, addPart, addGroupPart) {

// ============================================================
// HULL: a "sleek bus" fuselage — a loft of rounded-rectangle
// cross-sections from a near-point rounded nose to a blunt,
// flattish tail where the nacelles attach. Flat-ish sides carry
// the side windows; the front tapers down for the cockpit area.
// ============================================================
// one rounded-rectangle cross-section, generated (not hand-picked) so it's
// dense and smooth rather than faceted — a superellipse, which gives flat-
// ish sides with properly rounded corners.
const RING_SEGMENTS = 28;
const RING_UNIT = Array.from({ length: RING_SEGMENTS }, (_, i) => {
  const theta = (i / RING_SEGMENTS) * Math.PI * 2;
  const c = Math.cos(theta), s = Math.sin(theta);
  const p = 4; // superellipse exponent — higher = squarer, 2 = a plain circle
  return [Math.sign(c) * Math.abs(c) ** (2 / p), Math.sign(s) * Math.abs(s) ** (2 / p)];
});
// Stations run nose (-Z) to tail (+Z). The nose cap is generated, not hand-
// picked: radius grows with a quarter-circle (sine) curve instead of a
// straight line, which is what actually makes a tip read as a rounded dome
// rather than a cone — a cone is what a *linear* taper to a point looks like,
// no matter how small the tip radius is. The droop (cy) is strongest right at
// the tip and eases off over the same curve, blending into the body.
const NOSE_CAP = (() => {
  const tipZ = -1.40, capLen = 0.40, maxSx = 0.46, maxSy = 0.34;
  const droopTip = -0.18, droopBase = -0.02; // droopBase matches the next hand station, for a seamless blend
  const steps = 6;
  return Array.from({ length: steps }, (_, i) => {
    const t = i / (steps - 1);
    const angle = t * (Math.PI / 2);
    const z = tipZ + capLen * (1 - Math.cos(angle));
    const sx = maxSx * Math.sin(angle);
    const sy = maxSy * Math.sin(angle);
    const cy = droopBase + (droopTip - droopBase) * (1 - Math.sin(angle));
    return { z, sx, sy, cy };
  });
})();
const STATIONS = [
  ...NOSE_CAP, // tip (z=-1.40) through z=-1.00, rounded + drooping
  { z: -0.84, sx: 0.52, sy: 0.385, cy: -0.008 },
  { z: -0.68, sx: 0.56, sy: 0.41, cy: 0 },
  { z: -0.45, sx: 0.585, sy: 0.425, cy: 0 },
  { z: -0.15, sx: 0.60, sy: 0.44, cy: 0 },      // cabin, full width
  { z: 0.30, sx: 0.60, sy: 0.44, cy: 0 },
  { z: 0.85, sx: 0.58, sy: 0.42, cy: 0 },       // cabin toward the tail
  { z: 1.25, sx: 0.38, sy: 0.32, cy: 0 },       // blunt tail (nacelles attach here)
];
function hullExtentsAtZ(z) {
  for (let i = 0; i < STATIONS.length - 1; i++) {
    const a = STATIONS[i], b = STATIONS[i + 1];
    if (z >= a.z && z <= b.z) {
      const t = (z - a.z) / (b.z - a.z);
      return { sx: a.sx + t * (b.sx - a.sx), sy: a.sy + t * (b.sy - a.sy), cy: a.cy + t * (b.cy - a.cy) };
    }
  }
  const edge = z < STATIONS[0].z ? STATIONS[0] : STATIONS[STATIONS.length - 1];
  return { sx: edge.sx, sy: edge.sy, cy: edge.cy };
}

function buildHullGeometry() {
  const n = RING_UNIT.length;
  const positions = [];
  STATIONS.forEach((st) => {
    RING_UNIT.forEach(([ux, uy]) => positions.push(ux * st.sx, uy * st.sy + (st.cy || 0), st.z));
  });
  const noseCapIdx = STATIONS.length * n;
  const tailCapIdx = noseCapIdx + 1;
  positions.push(0, STATIONS[0].cy || 0, STATIONS[0].z); // nose cap centre
  positions.push(0, STATIONS[STATIONS.length - 1].cy || 0, STATIONS[STATIONS.length - 1].z); // tail cap centre

  const idx = [];
  for (let s = 0; s < STATIONS.length - 1; s++) {
    for (let j = 0; j < n; j++) {
      const j2 = (j + 1) % n;
      const a = s * n + j, b = s * n + j2, c = (s + 1) * n + j2, d = (s + 1) * n + j;
      idx.push(a, b, d, b, c, d);
    }
  }
  for (let j = 0; j < n; j++) {
    const j2 = (j + 1) % n;
    idx.push(noseCapIdx, j, j2); // nose cap fan
    const base = (STATIONS.length - 1) * n;
    idx.push(tailCapIdx, base + j2, base + j); // tail cap fan
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

  engineMeshes.push(...hexBulge(sx * x, cy, [[0.0, 0.03, 0.03], [0.3, 0.12, 0.1], [0.6, 0.15, 0.13], [1.4, 0.15, 0.13], [1.58, 0.14, 0.12]], 1.2, 1.1));
}));
addGroupPart("engines", "Thruster bulges (4 in a row, hexagonal)", groupOf(engineMeshes), engineMeshes);

// ============================================================
// HULL DETAILS: raised trims along the chines and spine edges, a crew
// hatch outline on the spine behind the cockpit, vent grilles on the
// shoulders, a dorsal sensor mast with a small dish, a ventral sensor
// blister, and a nose sensor probe.
// ============================================================
const detailMeshes = [];
function trimAlong(fx, key, z0, z1, r) {
  const pts = Array.from({ length: 9 }, (_, i) => { const z = z0 + ((z1 - z0) * i) / 8, s = bodyAt(z); return [fx * s.w, Y0 + s[key], z]; });
  for (let i = 0; i < pts.length - 1; i++) detailMeshes.push(strutBetween(V(pts[i]), V(pts[i + 1]), r, 6));
}
MIRROR.forEach((sx) => {
  trimAlong(sx * 0.6, "t1", -1.7, 1.38, 0.009);
  trimAlong(sx * 0.2, "t2", -0.36, 0.0, 0.008);
  // shoulder vent grille: framed panel on the upper chine facet with slats
  const z0 = 0.05, z1 = 0.45, P = bodyAt(z0), Q = bodyAt(z1);
  const p = (s, f) => [sx * (0.2 * s.w + f * 0.4 * s.w), Y0 + s.t2 + f * (s.t1 - s.t2), s.z];
  const vent = planarPanel([p(P, 0.15), p(Q, 0.15), p(Q, 0.5), p(P, 0.5)], { inner: 0.02, proud: 0.007, fill: true, fillLift: 0.001 });
  detailMeshes.push(...vent.meshes);
  for (let i = 0; i < 4; i++) {
    const z = z0 + 0.07 + i * 0.09, s = bodyAt(z), c = p(s, 0.325);
    detailMeshes.push(faceBox(vent.B, c, 0.012, 0.13, 0.012, 0.004));
  }
});
{
  // crew hatch on the spine facet
  const za = -0.25, zb = 0.15, A = bodyAt(za), B = bodyAt(zb);
  const hw = 0.11;
  detailMeshes.push(...planarPanel([[-hw, Y0 + A.t2, za], [hw, Y0 + A.t2, za], [hw, Y0 + B.t2, zb], [-hw, Y0 + B.t2, zb]], { inner: 0.018, proud: 0.006, outwardFrom: (q) => [q.x, q.y - 1, q.z] }).meshes);
  // dorsal sensor mast + dish, standing on the spine between the inner bulges' fronts
  const mz = 0.1, my = Y0 + bodyAt(mz).t2;
  detailMeshes.push(strutBetween(V([0, my - 0.03, mz]), V([0, my + 0.2, mz]), 0.016, 8));
  const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.03, 0.035, 12), partMaterial());
  dish.position.set(0, my + 0.21, mz);
  dish.rotation.x = -0.5;
  detailMeshes.push(dish);
  // ventral sensor blister (faceted)
  const bz = -0.5, by = bottomY(0, bz);
  detailMeshes.push(loftRings([hexRing(0, by + 0.01, 0.0, 0.0, bz - 0.22), hexRing(0, by - 0.02, 0.09, 0.05, bz - 0.12), hexRing(0, by - 0.02, 0.09, 0.05, bz + 0.12), hexRing(0, by + 0.01, 0.0, 0.0, bz + 0.22)]));
  // nose probe with two collars
  detailMeshes.push(strutBetween(V([0, Y0, -1.85]), V([0, Y0, -2.35]), 0.012, 8));
  [-2.08, -2.22].forEach((z) => detailMeshes.push(lathe([[0, z - 0.014], [0.024, z - 0.014], [0.024, z + 0.014], [0, z + 0.014]], 0, Y0, 6)));
}
addGroupPart("hullDetails", "Hull details (trims, hatch, vents, sensors, probe)", groupOf(detailMeshes), detailMeshes);

// ============================================================
// LEGS: four short, thick legs (front pair and rear pair). Round
// struts, knee, actuator, hex pads. Struts start inside the body;
// all pads level.
// ============================================================
const FOOT_Y = -0.46;
function makeLeg(top, foot) {
  const knee = top.clone().lerp(foot, 0.5).add(V([0, 0, -0.035]));
  const kj = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), partMaterial());
  kj.position.copy(knee);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.035, 6), partMaterial());
  pad.position.set(foot.x, FOOT_Y - 0.0175, foot.z);
  return [strutBetween(top, knee, 0.04), strutBetween(knee, foot, 0.032),
    strutBetween(top.clone().add(V([0, 0, 0.06])), knee.clone().add(V([0, 0.02, 0.03])), 0.014, 6), kj, pad];
}
const legMeshes = [];
[[0.32, -0.6, 0.42], [0.58, 1.0, 0.7]].forEach(([xt, z, xf]) => MIRROR.forEach((sx) => legMeshes.push(...makeLeg(V([sx * xt, -0.12, z]), V([sx * xf, FOOT_Y, z + 0.04])))));
addGroupPart("legs", "Legs (4, short & thick)", groupOf(legMeshes), legMeshes);

ship.position.y = 0.5;






    },
  }
];

// ---------- switching ships ----------
let ship = null, parts = [], current = -1;
function disposeShip() {
  if (!ship) return;
  scene.remove(ship);
  ship.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
}
function loadShip(i) {
  if (i === current) return;
  disposeShip();
  current = i;
  const s = SHIPS[i];
  ship = new THREE.Group();
  ship.name = s.name;
  parts = [];
  const addPart = (key, label, mesh) => { mesh.name = key; ship.add(mesh); parts.push({ key, label, mesh, visible: true, highlighted: false }); return mesh; };
  const addGroupPart = (key, label, group, meshes) => { group.name = key; ship.add(group); parts.push({ key, label, mesh: group, visible: true, highlighted: false, multi: meshes }); return group; };
  s.build(THREE, ship, partMaterial, addPart, addGroupPart);
  scene.add(ship);
  document.getElementById("title").innerHTML = `${s.name}<small>${s.cat} ship &middot; ${s.size} &middot; approved concept, grey shape only</small>`;
  controls.minDistance = s.minD;
  controls.maxDistance = s.maxD;
  resetView();
  buildPartList();
  document.querySelectorAll(".tab").forEach((t, k) => t.classList.toggle("active", Number(t.dataset.i) === i));
  try { history.replaceState(null, "", "#" + s.slug); } catch (e) { /* not allowed here: fine */ }
}
function resetView() {
  const s = SHIPS[current];
  camera.position.set(...s.home);
  controls.target.set(...s.target);
  controls.update();
}
document.getElementById("reset").onclick = resetView;

// ---------- tabs ----------
const tabsEl = document.getElementById("tabs");
let lastCat = "";
SHIPS.forEach((s, i) => {
  if (s.cat !== lastCat) {
    const c = document.createElement("span");
    c.className = "cat";
    c.textContent = s.cat;
    tabsEl.appendChild(c);
    lastCat = s.cat;
  }
  const b = document.createElement("button");
  b.className = "tab";
  b.dataset.i = i;
  b.innerHTML = `${s.name}<small>${s.size}</small>`;
  b.onclick = () => loadShip(i);
  tabsEl.appendChild(b);
});

// ---------- parts list (hide / highlight) ----------
const listEl = document.getElementById("part-list");
function setHighlight(p, on) {
  p.highlighted = on;
  (p.multi || [p.mesh]).forEach((m) => m.material.color.set(on ? HILITE : GREY));
}
function buildPartList() {
  listEl.innerHTML = "";
  parts.forEach((p) => {
    const row = document.createElement("div");
    row.className = "part-row";
    const name = document.createElement("div");
    name.className = "part-name";
    name.textContent = p.label;
    const hiBtn = document.createElement("button");
    hiBtn.className = "btn btn-highlight";
    hiBtn.textContent = "Highlight";
    hiBtn.onclick = () => {
      parts.forEach((o) => { if (o !== p && o.highlighted) { setHighlight(o, false); o._btn.classList.remove("active"); } });
      const on = !p.highlighted;
      setHighlight(p, on);
      hiBtn.classList.toggle("active", on);
    };
    p._btn = hiBtn;
    const tog = document.createElement("button");
    tog.className = "btn btn-toggle";
    tog.textContent = "Shown";
    tog.onclick = () => {
      p.visible = !p.visible;
      p.mesh.visible = p.visible;
      tog.textContent = p.visible ? "Shown" : "Hidden";
      tog.classList.toggle("off", !p.visible);
    };
    row.append(name, hiBtn, tog);
    listEl.appendChild(row);
  });
}

// ---------- start on the ship named in the address (#cargo-2), else the first ----------
const wanted = SHIPS.findIndex((s) => "#" + s.slug === location.hash);
loadShip(wanted >= 0 ? wanted : 0);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
