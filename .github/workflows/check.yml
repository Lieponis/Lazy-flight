name: Check a branch

# Runs the tests and the build on every branch EXCEPT main, so a branch can be checked before it is merged.
# It never publishes anything (publishing stays in deploy.yml, which only runs on main).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch: # lets you also start it by hand from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install software the project needs
        run: npm install
      - name: Run the full check (types, build, tests)
        run: npm run check
