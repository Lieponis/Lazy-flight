<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A test app (not the game): which way of drawing reaches the very top and bottom of an installed iPhone app?
         Round 2: five columns, each drawn a different way, each with a label at its bottom edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="ios-fill-test.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fill test" />
    <meta name="theme-color" content="#ff8800" />
    <title>Fill test 2</title>
    <style>
      html { background: #ff00ff; }
      body { margin: 0; font: 14px/1.25 monospace; color: #fff; touch-action: none; }
      .col { top: 0; width: 20%; box-sizing: border-box; border-bottom: 8px solid #fff; }
      .lab { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; background: #000; font-size: 22px; }
      #c1 { position: fixed; bottom: 0; left: 0; background: #c00; }
      #c2 { position: fixed; height: 100lvh; left: 20%; background: #cc0; }
      #c3 { position: absolute; height: 100lvh; left: 40%; background: #06c; }
      #c4 { position: relative; height: 100lvh; margin-left: 60%; background: #0a0; }
      #c5 { position: absolute; left: 80%; background: #ccc; }
      #c5 .lab { color: #000; background: #fff; }
      #info { position: fixed; left: 8px; right: 8px; top: 35%; background: rgba(0, 0, 0, 0.85); padding: 6px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="col" id="c4"><span class="lab">4</span></div>
    <div class="col" id="c1"><span class="lab">1</span></div>
    <div class="col" id="c2"><span class="lab">2</span></div>
    <div class="col" id="c3"><span class="lab">3</span></div>
    <canvas class="col" id="c5"></canvas>
    <div id="info"></div>
    <script>
      // 5: a canvas, placed normally (not fixed), as tall as the whole physical screen, drawn by script.
      const c5 = document.getElementById("c5");
      function show() {
        const portrait = innerHeight >= innerWidth;
        const screenH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        c5.style.height = screenH + "px";
        c5.width = 40;
        c5.height = screenH;
        const g = c5.getContext("2d");
        g.fillStyle = "#ccc";
        g.fillRect(0, 0, 40, screenH);
        g.fillStyle = "#000";
        g.fillRect(0, screenH - 30, 40, 30);
        g.fillStyle = "#fff";
        g.font = "22px monospace";
        g.fillText("5", 14, screenH - 8);
        document.getElementById("info").textContent =
          `Round 2. Which numbers can you see at the very bottom?\n` +
          `1 fixed, inset 0 (red)\n2 fixed, 100lvh (yellow)\n3 absolute, 100lvh (blue)\n4 normal block, 100lvh (green)\n5 canvas, screen height (grey)\n` +
          `Pink = page background\n\n` +
          `screen ${screen.width}x${screen.height}  inner ${innerWidth}x${innerHeight}\n` +
          `scrollHeight ${document.documentElement.scrollHeight}  scrollY ${Math.round(scrollY)}\n` +
          `${navigator.userAgent.replace(/.*Version\/([\d.]+).*/, "Version $1")}`;
      }
      show();
      addEventListener("resize", show);
      setTimeout(show, 500);
    </script>
  </body>
</html>
