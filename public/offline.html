<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <title>Lazy Flight - no signal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060d; color: #cfe9e6; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; line-height: 1.35;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box; text-align: center;
      }
      main { max-width: 26em; border: 1px solid rgba(63, 224, 208, 0.5); background: #070c15; padding: 20px 22px; }
      h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: 2px; color: #3fe0d0; font-weight: normal; }
      p { margin: 0 0 12px; }
      .amber { color: #ffb547; }
      a.button {
        display: inline-block; margin-top: 4px; padding: 10px 18px; min-height: 24px;
        color: #3fe0d0; border: 1px solid #3fe0d0; background: rgba(10, 30, 36, 0.92);
        text-decoration: none; letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LAZY FLIGHT</h1>
      <p class="amber">No signal, captain.</p>
      <p>The hangar cannot be reached right now. Your ship is parked and your saved game is safe on this device.</p>
      <p>Connect to the internet once, then open the game again. After that it plays without a connection.</p>
      <a class="button" href="./">TRY AGAIN</a>
    </main>
  </body>
</html>
